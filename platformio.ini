; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Actual silicon on this board (read back with esptool flash_id) ---
;   ESP32-S3 (QFN56) rev v0.2, 8 MB embedded OCTAL PSRAM (AP_3v3), 16 MB quad flash
; The stock esp32-s3-devkitc-1 profile is the N8 "8 MB, no PSRAM" variant, so the
; flash size, partition table and PSRAM bus width all have to be overridden.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- Serial goes over the CH340K UART bridge (COM4), not the native USB port ---
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.6

; --- Host-side unit tests for the pure-logic libraries ---
; The modules under lib/ deliberately do not include Arduino.h, so they compile and
; run here. That is what makes it possible to test a two-second landing sequence in
; microseconds, and to test cases that cannot practically be staged on a desk: a
; laser dropout at 8 m, a fast canopy, a thermal, a corrupt stored setting.
;
;   pio test -e native
;
; test_build_src stays off: src/ is the hardware layer and must not be dragged in.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
