; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_deps =
    sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.6

; --- DevKitC-form ESP32-S3 N16R8 clone + PinPulse shield: the bench board ---
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Actual silicon on this board (read back with esptool flash_id) ---
;   ESP32-S3 (QFN56) rev v0.2, 8 MB embedded OCTAL PSRAM (AP_3v3), 16 MB quad flash
; The stock esp32-s3-devkitc-1 profile is the N8 "8 MB, no PSRAM" variant, so the
; flash size, partition table and PSRAM bus width all have to be overridden.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- Serial goes over the CH340K UART bridge (COM4), not the native USB port ---
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps = ${common.lib_deps}

; --- Seeed XIAO ESP32S3: the flight board (received 2026-10-01) ---
; S3R8 with 8 MB octal PSRAM + 8 MB quad flash. The stock profile already matches
; the silicon, so none of the overrides above are needed. There is no CH340: the
; console is the native USB CDC, which the profile selects with
; ARDUINO_USB_CDC_ON_BOOT=1 -- that is what makes src/hw_console.h collapse to a
; single stream. Pins come from the FLARE_BOARD_XIAO block in src/pins.h.
; Upload needs no button press and the app starts by itself afterwards.
;
; 中文：XIAO 的板卡配置和芯片本来就一致，上面那堆 override 一个都不用。
;       没有 CH340，控制台走原生 USB CDC；引脚看 pins.h 里 FLARE_BOARD_XIAO 那段。
;       烧录不用按键，烧完自动启动。
[env:xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DFLARE_BOARD_XIAO
lib_deps = ${common.lib_deps}

; --- Host-side unit tests for the pure-logic libraries ---
; The modules under lib/ deliberately do not include Arduino.h, so they compile and
; run here. That is what makes it possible to test a two-second landing sequence in
; microseconds, and to test cases that cannot practically be staged on a desk: a
; laser dropout at 8 m, a fast canopy, a thermal, a corrupt stored setting.
;
;   pio test -e native
;
; test_build_src stays off: src/ is the hardware layer and must not be dragged in.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
